services:
  postgres:
    image: postgres:16-alpine
    container_name: citicare-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: citicare_dev_2026
      POSTGRES_DB: citicare
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
